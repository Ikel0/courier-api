[project]
name = "courier-api"
version = "0.1.0"
description = "A production-minded shipment API reference built with FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.30,<0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
